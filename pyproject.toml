[project]
name = "legal-rag-hallucination-detection"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
	"fastapi>=0.115",
	"uvicorn>=0.30",
	"python-multipart>=0.0.9",
	"pymupdf>=1.24",
	"langchain-text-splitters>=0.2",
	"sentence-transformers>=2.7",
	"torch",
	"faiss-cpu>=1.8",
	"openai>=1.30",
	"numpy>=1.26",
	"python-dotenv>=1.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "api:app"
